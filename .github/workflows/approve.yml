name: Approve Content

on:
  issues:
    types: [labeled]

jobs:
  process:
    if: >
      github.event.label.name == 'approved' ||
      github.event.label.name == 'rejected'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Process approval
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || '';
            const labels = context.payload.issue.labels.map(l => l.name);
            const isApproved = labels.includes('approved');

            // Extract type, name, post from title
            let type = '', name = '', post = '';
            if (title.startsWith('[Guestbook]')) {
              type = 'guestbook';
              name = title.replace('[Guestbook]', '').trim();
            } else if (title.startsWith('[Comment]')) {
              type = 'comment';
              const parts = title.replace('[Comment]', '').trim().split(' - ');
              post = parts[0] || '';
              name = parts[1] || '';
            }

            // Extract message (multiline) and date from body
            let message = '', date = '';
            const lines = body.split('\n');
            let inMessage = false;
            for (const line of lines) {
              const t = line.trim();
              if (t.startsWith('**Message:**')) {
                message = t.replace('**Message:**', '').trim();
                inMessage = true;
                continue;
              }
              if (t.startsWith('**Date:**')) {
                date = t.replace('**Date:**', '').trim();
                inMessage = false;
                continue;
              }
              if (inMessage && t.startsWith('**')) {
                inMessage = false;
                continue;
              }
              if (inMessage) {
                message += '\n' + t;
              }
            }
            if (!date) date = new Date().toISOString().split('T')[0];

            console.log(`Type: ${type}, Name: ${name}, Date: ${date}, Post: ${post}`);
            console.log(`Message: ${message}`);
            console.log(`Approved: ${isApproved}`);

            // Escape YAML-special characters (backslash and double quote)
            function yamlEscape(s) {
              return s.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n');
            }

            // Write to data file if approved
            if (isApproved && type) {
              const entry = `\n- name: "${yamlEscape(name)}"\n  date: "${yamlEscape(date)}"\n  message: "${yamlEscape(message)}"\n`;

              if (type === 'guestbook') {
                fs.appendFileSync('_data/guestbook.yml', entry, 'utf-8');
                console.log('Appended to _data/guestbook.yml');
              } else if (type === 'comment' && post) {
                const dir = '_data/comments';
                if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
                fs.appendFileSync(`${dir}/${post}.yml`, entry, 'utf-8');
                console.log(`Appended to _data/comments/${post}.yml`);
              }
            }

            // Commit and push if approved
            if (isApproved && type) {
              const cp = require('child_process');
              cp.spawnSync('git', ['config', 'user.name', 'github-actions[bot]'], { stdio: 'pipe' });
              cp.spawnSync('git', ['config', 'user.email', 'github-actions[bot]@users.noreply.github.com'], { stdio: 'pipe' });
              cp.spawnSync('git', ['add', '_data/'], { stdio: 'pipe' });

              const diffResult = cp.spawnSync('git', ['diff', '--staged', '--quiet'], { stdio: 'pipe' });
              if (diffResult.status !== 0) {
                cp.spawnSync('git', ['commit', '-m', `Add ${type} from ${name}`], { stdio: 'pipe' });
                cp.spawnSync('git', ['pull', '--rebase'], { stdio: 'pipe' });
                cp.spawnSync('git', ['push'], { stdio: 'pipe' });
                console.log('Committed and pushed');

                // Trigger deploy
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'jekyll.yml',
                  ref: 'main'
                });
                console.log('Deploy triggered');
              } else {
                console.log('No changes to commit');
              }
            }

            // Close issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: isApproved ? 'completed' : 'not_planned'
            });
            console.log(`Issue closed as ${isApproved ? 'completed' : 'not_planned'}`);
