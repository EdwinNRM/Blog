name: Approve Content

on:
  issues:
    types: [labeled]

jobs:
  process:
    if: >
      github.event.label.name == 'approved' ||
      github.event.label.name == 'rejected'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract issue data
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || '';
            const labels = context.payload.issue.labels.map(l => l.name);

            let type = '';
            let post = '';
            let name = '';

            if (title.startsWith('[Guestbook]')) {
              type = 'guestbook';
              name = title.replace('[Guestbook]', '').trim();
            } else if (title.startsWith('[Comment]')) {
              type = 'comment';
              const parts = title.replace('[Comment]', '').trim().split(' - ');
              post = parts[0] || '';
              name = parts[1] || '';
            }

            const lines = body.split('\n');
            let message = '';
            let date = '';
            let inMessage = false;

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('**Message:**')) {
                inMessage = true;
                message = trimmed.replace('**Message:**', '').trim();
              } else if (trimmed.startsWith('**Date:**')) {
                date = trimmed.replace('**Date:**', '').trim();
              } else if (inMessage && trimmed && !trimmed.startsWith('**')) {
                message += '\n' + trimmed;
              }
            }

            if (!date) {
              date = new Date().toISOString().split('T')[0];
            }

            core.setOutput('type', type);
            core.setOutput('name', name);
            core.setOutput('message', message);
            core.setOutput('date', date);
            core.setOutput('post', post);
            core.setOutput('approved', String(labels.includes('approved')));

      - name: Add to guestbook
        if: steps.extract.outputs.approved == 'true' && steps.extract.outputs.type == 'guestbook'
        run: |
          NAME='${{ toJSON(steps.extract.outputs.name) }}'
          DATE='${{ toJSON(steps.extract.outputs.date) }}'
          MESSAGE='${{ toJSON(steps.extract.outputs.message) }}'
          python3 -c "
          import json, sys
          name = json.loads(sys.argv[1])
          date = json.loads(sys.argv[2])
          message = json.loads(sys.argv[3])
          entry = '- name: \"' + name + '\"\n  date: \"' + date + '\"\n  message: \"' + message + '\"'
          with open('_data/guestbook.yml', 'a', encoding='utf-8') as f:
              f.write('\n' + entry + '\n')
          "

      - name: Add to comments
        if: steps.extract.outputs.approved == 'true' && steps.extract.outputs.type == 'comment'
        run: |
          NAME='${{ toJSON(steps.extract.outputs.name) }}'
          DATE='${{ toJSON(steps.extract.outputs.date) }}'
          MESSAGE='${{ toJSON(steps.extract.outputs.message) }}'
          POST='${{ toJSON(steps.extract.outputs.post) }}'
          python3 -c "
          import json, sys, os
          name = json.loads(sys.argv[1])
          date = json.loads(sys.argv[2])
          message = json.loads(sys.argv[3])
          post = json.loads(sys.argv[4])
          entry = '- name: \"' + name + '\"\n  date: \"' + date + '\"\n  message: \"' + message + '\"'
          os.makedirs('_data/comments', exist_ok=True)
          with open('_data/comments/' + post + '.yml', 'a', encoding='utf-8') as f:
              f.write('\n' + entry + '\n')
          "

      - name: Commit and push
        if: steps.extract.outputs.approved == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/
          git diff --staged --quiet || git commit -m "Add ${{ steps.extract.outputs.type }} from ${{ steps.extract.outputs.name }}"
          git push

      - name: Trigger deploy
        if: steps.extract.outputs.approved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'jekyll.yml',
              ref: 'main'
            });

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            const approved = '${{ steps.extract.outputs.approved }}' === 'true';
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: approved ? 'completed' : 'not_planned'
            });
      