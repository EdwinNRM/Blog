name: Approve Content

on:
  issues:
    types: [labeled]

jobs:
  process:
    if: >
      github.event.label.name == 'approved' ||
      github.event.label.name == 'rejected'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Process approval
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || '';
            const labels = context.payload.issue.labels.map(l => l.name);
            const isApproved = labels.includes('approved');

            // Extract type, name, post from title
            let type = '', name = '', post = '';
            if (title.startsWith('[Guestbook]')) {
              type = 'guestbook';
              name = title.replace('[Guestbook]', '').trim();
            } else if (title.startsWith('[Comment]')) {
              type = 'comment';
              const parts = title.replace('[Comment]', '').trim().split(' - ');
              post = parts[0] || '';
              name = parts[1] || '';
            }

            // Extract message (multiline) and date from body
            let message = '', date = '';
            const lines = body.split('\n');
            let inMessage = false;
            for (const line of lines) {
              const t = line.trim();
              if (t.startsWith('**Message:**')) {
                message = t.replace('**Message:**', '').trim();
                inMessage = true;
                continue;
              }
              if (t.startsWith('**Date:**')) {
                date = t.replace('**Date:**', '').trim();
                inMessage = false;
                continue;
              }
              if (inMessage && t.startsWith('**')) {
                inMessage = false;
                continue;
              }
              if (inMessage) {
                message += '\n' + t;
              }
            }
            if (!date) date = new Date().toISOString().split('T')[0];

            console.log(`Type: ${type}, Name: ${name}, Date: ${date}, Post: ${post}`);
            console.log(`Message: ${message}`);
            console.log(`Approved: ${isApproved}`);

            // Escape YAML-special characters (backslash and double quote)
            function yamlEscape(s) {
              return s.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n');
            }

            // Write to data file if approved
            if (isApproved && type) {
              const cp = require('child_process');
              const run = (args) => {
                const r = cp.spawnSync('git', args, { stdio: 'pipe' });
                if (r.status !== 0) {
                  console.log(`git ${args.join(' ')} failed (${r.status}): ${(r.stderr || '').toString().trim()}`);
                }
                return r.status;
              };
              const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
              const entry = `\n- name: "${yamlEscape(name)}"\n  date: "${yamlEscape(date)}"\n  message: "${yamlEscape(message)}"\n`;

              if (type === 'guestbook') {
                fs.appendFileSync('_data/guestbook.yml', entry, 'utf-8');
                console.log('Appended to _data/guestbook.yml');
              } else if (type === 'comment' && post) {
                const dir = '_data/comments';
                if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
                fs.appendFileSync(`${dir}/${post}.yml`, entry, 'utf-8');
                console.log(`Appended to _data/comments/${post}.yml`);
              }

              run(['config', 'user.name', 'github-actions[bot]']);
              run(['config', 'user.email', 'github-actions[bot]@users.noreply.github.com']);
              run(['add', '_data/']);

              if (run(['diff', '--staged', '--quiet']) === 0) {
                console.log('No changes to commit');
              } else {
                run(['commit', '-m', `Add ${type} from ${name}`]);
                console.log('Committed');

                // Push with retries: concurrent approval runs can modify the same
                // _data file, so recover from rejected pushes/conflicts by
                // resetting to origin and re-applying the entry.
                let pushed = false;
                for (let attempt = 0; attempt < 10 && !pushed; attempt++) {
                  if (run(['push']) === 0) {
                    pushed = true;
                    break;
                  }
                  console.log(`Push failed on attempt ${attempt + 1}, syncing with origin...`);
                  if (run(['pull', '--rebase']) !== 0) {
                    run(['rebase', '--abort']);
                    run(['fetch', 'origin']);
                    run(['reset', '--hard', 'origin/main']);
                    fs.appendFileSync('_data/guestbook.yml', entry, 'utf-8');
                    run(['add', '_data/']);
                    run(['commit', '-m', `Add ${type} from ${name}`]);
                  }
                  await sleep(3000);
                }

                if (pushed) {
                  console.log('Committed and pushed');

                  // Trigger deploy
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'jekyll.yml',
                    ref: 'main'
                  });
                  console.log('Deploy triggered');
                } else {
                  console.log('Push failed after retries');
                }
              }
            }

            // Close issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: isApproved ? 'completed' : 'not_planned'
            });
            console.log(`Issue closed as ${isApproved ? 'completed' : 'not_planned'}`);
