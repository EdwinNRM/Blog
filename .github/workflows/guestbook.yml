name: Process Guestbook

on:
  issues:
    types: [opened]

jobs:
  add-guestbook:
    if: startsWith(github.event.issue.title, '[Guestbook]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add guestbook label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['guestbook']
            });

      - name: Extract guestbook entry
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            const lines = body.split('\n');
            let name = '';
            let message = '';
            let inMessage = false;

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('**Name:**')) {
                name = trimmed.replace('**Name:**', '').trim();
              } else if (trimmed === '**Message:**') {
                inMessage = true;
              } else if (inMessage && trimmed) {
                message += (message ? '\n' : '') + trimmed;
              }
            }

            const date = new Date().toISOString().split('T')[0];
            core.setOutput('name', name);
            core.setOutput('message', message);
            core.setOutput('date', date);

      - name: Add to guestbook.yml
        run: |
          NAME='${{ toJSON(steps.extract.outputs.name) }}'
          DATE='${{ toJSON(steps.extract.outputs.date) }}'
          MESSAGE='${{ toJSON(steps.extract.outputs.message) }}'
          python3 -c "
          import json, sys
          name = json.loads(sys.argv[1])
          date = json.loads(sys.argv[2])
          message = json.loads(sys.argv[3])
          entry = '- name: \"' + name + '\"\n  date: \"' + date + '\"\n  message: \"' + message + '\"'
          with open('_data/guestbook.yml', 'a') as f:
              f.write('\n' + entry + '\n')
          " "$NAME" "$DATE" "$MESSAGE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/guestbook.yml
          git commit -m "Add guestbook entry from ${{ steps.extract.outputs.name }}"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Trigger deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'jekyll.yml',
              ref: 'main'
            });
