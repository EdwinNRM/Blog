title: "edwinnrm"
description: "Apenas um blog pessoal"
url: "https://edwinnrm.github.io"
baseurl: "/Blog"
permalink: /:categories/:title/

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
paginate_path: "/blog/page:num/"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - PLAN.md
  - README.md
  - assets/audio/README.md
  - add_music.py

include:
  - pages

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

collections:
  pages:
    output: true
    permalink: /:path/
