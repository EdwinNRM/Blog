- name: "kaass"
  date: "2026-07-27"
  message: |
    Bom, o avanço do nosso amigo Claudio é muito tentador de usar. Afinal, é uma ferramenta em que você simplesmente escreve um prompt e praticamente tudo sai pronto.

    Mas, ao mesmo tempo, eu me sinto meio "burro" quando uso dessa forma. Tenho a sensação de que estou negligenciando minha própria capacidade de pensar e resolver problemas. Muitas vezes acabo delegando para a IA coisas que eu conseguiria fazer sozinho, com um pouco mais de esforço.

    Hoje, quando encontro um problema, minha primeira reação é jogar para a IA. Isso resolve a situação rapidamente, mas também me dá a impressão de que estou deixando de aprender o processo de encontrar a solução por conta própria. Acho que o desafio é encontrar um equilíbrio: usar a IA como uma ferramenta para orientar e acelerar o aprendizado, e não como um substituto do nosso raciocínio.

- name: "Luana"
  date: "2026-07-30"
  message: "Confesso que ultimamente tenho dependido muito do Claude para tarefas que sei que são básicas e fáceis, mas o comodismo às vezes fala mais alto. Tenho pensado em maneiras de me desvincular dessa dependência compulsória  e em como isso melhoraria muito meu rendimento e meu entendimento geral do mundo da computação.\n\nFico muito feliz em saber que você tomou a iniciativa de criar um blog e mantê-lo ativo. Sei que dedicar tempo à escrita pode parecer confuso e até meio \"meaningless\", mas tenho certeza de que esse blog vai se transformar em um santuário para você. Além de ser um ótimo lugar para praticar a escrita, também vai acompanhar sua trajetória e das coisas que você aprende pelo caminho.\nUm forte abraço. :red-heart:"
