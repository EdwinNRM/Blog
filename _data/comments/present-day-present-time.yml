- name: "Lua"
  date: "2026-08-06"
  message: |
    Caraca, isso me fez lembrar muito Ghost in the Shell e Psycho-Pass, confesso que não assisti nenhum dos dois ainda, mas esse tema sempre me interessou muito. Fico pensando em como é bizarro pensar que tanta coisa que era considerada distópica e cyberpunk acabou virando uma parte completamente integrada da sociedade atual. Na época parecia um futuro absurdo, hoje é só... quinta-feira.

    Esse post vai me deixar pensando sobre ética e evolução tech por um tempo haha :tongue-out:

- name: "padawan"
  date: "2026-08-06"
  message: "Nunca tinha parado para pensar em como revisitar uma obra anos depois pode dizer tanto sobre quem nos tornamos quanto sobre a própria obra. Eu mesma nunca assisti Lain, mas a reflexão fez muito sentido para mim. A frase que mais me marcou foi: \"Quanto disso já aconteceu?\". Anos atrás, tudo isso parecia apenas ficção; hoje, é assustador perceber o quanto deixou de ser. Também me fez pensar em como nos tornamos dependentes da nossa identidade digital e de todas essas ferramentas que fazem parte do nosso cotidiano. Eu acho que talvez, o mais curioso seja que mesmo estando cada vez mais conectados, isso não significa que estejamos realmente mais próximos uns dos outros."
