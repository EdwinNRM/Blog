  message: "Caraca, isso me fez lembrar muito Ghost in the Shell e Psycho-Pass, confesso que não assisti nenhum dos dois ainda, mas esse tema sempre me interessou muito. Fico pensando em como é bizarro pensar que tanta coisa que era considerada distópica e cyberpunk acabou virando uma parte completamente integrada da sociedade atual. Na época parecia um futuro absurdo, hoje é só... quinta-feira.\nEsse post vai me deixar pensando sobre ética e evolução tech por um tempo haha :tongue-out:"
