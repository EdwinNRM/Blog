<nav>
  <div class="sidebar-title">Menu</div>
  <ul class="sidebar-nav">
    {% for item in site.data.navigation %}
      <li>
        <a href="{{ item.url | relative_url }}"
           class="{% if page.url == item.url %}active{% endif %}">
          {{ item.title }}
        </a>
      </li>
    {% endfor %}
  </ul>

  <div class="sidebar-title" style="margin-top: 12px;">About</div>
  <div class="sidebar-box">
    <div class="sidebar-box__content">
      <p>Welcome to my little corner of the web!</p>
    </div>
  </div>

  <div class="sidebar-title">Last Posts</div>
  <div class="sidebar-box">
    <div class="sidebar-box__content">
      {% for post in site.posts limit:5 %}
        <div style="margin-bottom: 4px;">
          <a href="{{ post.url | relative_url }}" style="font-size: 11px;">
            {{ post.title }}
          </a>
          <br>
          <span style="font-size: 10px; color: #808080;">
            {{ post.date | date: "%d %b %Y" }}
          </span>
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="sidebar-title">Now Playing</div>
  <div class="sidebar-box">
    <div class="sidebar-box__content">
      <div id="music-player" class="music-player"></div>
      <script id="player-tracks" type="application/json">{{ site.data.music | jsonify }}</script>
      <script src="/assets/js/player.js"></script>
    </div>
  </div>

  <div class="sidebar-title">Links</div>
  <div class="sidebar-box">
    <div class="sidebar-box__content">
      <a href="{{ '/links/' | relative_url }}">Blogroll</a><br>
      <a href="{{ '/guestbook/' | relative_url }}">Guestbook</a>
    </div>
  </div>
</nav>
