---
layout: page
title: Chat - em construção
permalink: /chat/
---

<!-- Login modal -->
<div id="chat-login" class="chat-login-overlay">
  <div class="y2k-window chat-login-window">
    <div class="y2k-window__titlebar">
      <span>Chat - em construção</span>
      <div class="y2k-window__buttons"><span>_</span><span>□</span><span>×</span></div>
    </div>
    <div class="y2k-window__body">
      <div class="chat-login-form">
        <label for="chat-nick">Seu nick:</label>
        <input type="text" id="chat-nick" maxlength="20" placeholder="Nickname">
        <label>Sua cor:</label>
        <div id="chat-color-picker" class="chat-color-picker">
          <span class="chat-color-dot" data-color="#0000ff" data-name="Azul" style="background:#0000ff" title="Azul"></span>
          <span class="chat-color-dot" data-color="#008000" data-name="Verde" style="background:#008000" title="Verde"></span>
          <span class="chat-color-dot" data-color="#ff0000" data-name="Vermelho" style="background:#ff0000" title="Vermelho"></span>
          <span class="chat-color-dot" data-color="#800080" data-name="Roxo" style="background:#800080" title="Roxo"></span>
          <span class="chat-color-dot" data-color="#8B4513" data-name="Marrom" style="background:#8B4513" title="Marrom"></span>
        </div>
        <p id="chat-login-error" class="chat-login-error"></p>
        <button id="chat-login-btn" class="y2k-btn">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- Main chat -->
<div id="chat-main" class="chat-layout" style="display:none">
  <div class="y2k-window">
    <div class="y2k-window__titlebar">
      <span id="chat-window-title">lobby.txt</span>
      <div class="y2k-window__buttons"><span>_</span><span>□</span><span>×</span></div>
    </div>
    <div class="y2k-window__body">
      <div class="chat-info-bar">
        <span class="y2k-tag">Sala: <span id="chat-current-room">Lobby</span></span>
        <span class="y2k-tag">Online: <span id="chat-online-count">0</span></span>
        <span class="y2k-tag">Nick: <span id="chat-current-nick"></span></span>
        <button id="chat-logout-btn" class="y2k-btn" style="font-size:10px;padding:1px 6px;margin-left:auto">Sair</button>
      </div>
      <div class="chat-container">
        <div class="chat-sidebar">
          <div class="sidebar-title" style="margin:0">SALAS</div>
          <div id="chat-room-list" class="chat-room-list"></div>
          <div class="sidebar-title" style="margin-top:8px">USUÁRIOS</div>
          <div id="chat-user-list" class="chat-user-list"></div>
        </div>
        <div class="chat-main-area">
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-area">
            <textarea id="chat-input" placeholder="Digite sua mensagem..." rows="2"></textarea>
            <button class="emoticon-picker-btn" data-target="chat-input" type="button" title="Inserir emoticon">😊</button>
            <button id="chat-send-btn" class="y2k-btn" type="button">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{{ '/assets/js/chat.js' | relative_url }}"></script>
